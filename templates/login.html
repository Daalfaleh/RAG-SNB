<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>RAG-SNB Login</title>
</head>
<body>
    <form action="{{ url_for('do_login') }}" method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="login-box">
            <div class="login-header"><div>Login</div></div>
            {% if error %}<p role="alert">{{ error }}</p>{% endif %}
            <div class="input-box">
                <input type="text" class="input-field" name="username" placeholder="Username" autocomplete="username" required>
            </div>
            <div class="input-box">
                <input type="password" class="input-field" name="password" placeholder="Password" autocomplete="current-password" required>
            </div>
            <div class="input-submit">
                <button type="submit" class="submit-btn">Sign In</button>
            </div>
        </div>
    </form>
</body>
</html>
