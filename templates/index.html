        body {
            font-family: Arial, sans-serif;
            background-color: #e0f0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
             width: 80%;
             max-width: 800px;
             height: 600px;
             margin: 0 auto;
             display: flex;
             flex-direction: column;
             background-color: white;
             border-radius: 10px;
             box-shadow: 0 0 10px rgba(0,0,0,0.1);
             position: relative; /* Add this */

}

#chat-log {
    flex-grow: 1;
    overflow-y: auto;
    padding: 20px;
    padding-bottom: 20px; /* Increased to accommodate taller input area */
}
        .message {
            margin-bottom: 50px;
            clear: both;
        }
        .user-message {
            float: right;
            background-color: #DCF8C6;
            padding: 10px;

        }
        .bot-message {
            float: left;
            background-color: #E0E0E0;

        }
        .input-area {
             display: flex;
             padding: 10px;
             background-color: white;
             border-top: 1px solid #e0e0e0;
    
}
    #send-button {
    padding: 10px 20px;
    background-color: #4CAF50;
    color: white;
    border: none;
    border-radius: 0 5px 5px 0;
    cursor: pointer;
}
.typing-indicator {
    position: absolute;
    bottom: 10px;
    left: 10px;
    display: none;
    background-color: #E0E0E0;
    padding: 10px;
    border-radius: 10px;
    z-index: 1;
}
        .typing-indicator span {
            height: 10px;
            width: 10px;
            float: left;
            margin: -1 -2px;
            background-color: #9E9EA1;
            display: block;
            border-radius: 50%;
            opacity: 0.4;
        }
        .typing-indicator span:nth-of-type(1) {
            animation: 1s blink infinite 0.3333s;
        }
        .typing-indicator span:nth-of-type(2) {
            animation: 1s blink infinite 0.6666s;
        }
        .typing-indicator span:nth-of-type(3) {
            animation: 1s blink infinite 0.9999s;
        }
        @keyframes blink {
            50% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <script>
        document.addEventListener('contextmenu', function(event) {
            alert('Right-click is disabled');
            e.preventDefault();
        });

    </script>
    <div class="chat-container">
        <div id="chat-log">
            <div class="typing-indicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
            <div class="input-area">
                <input type="text" id="user-input" placeholder="Type your message...">
                <button id="send-button">Send</button>
            </div>
    </div>        
    <script>
        const chatLog = document.getElementById('chat-log');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');
        const typingIndicator = document.querySelector('.typing-indicator');\n        const csrfToken = document.querySelector('meta[name="csrf-token"]').content;

        function addMessage(sender, message, isUser = false) {
             const messageElement = document.createElement('div');
             messageElement.classList.add('message');
             messageElement.classList.add(isUser ? 'user-message' : 'bot-message');
             messageElement.textContent = message;

             const typingIndicator = document.querySelector('.typing-indicator');
             chatLog.insertBefore(messageElement, typingIndicator);
             chatLog.scrollTop = chatLog.scrollHeight;
}

function showTypingIndicator() {
        typingIndicator.style.display = 'block';
        chatLog.scrollTop = chatLog.scrollHeight;
    }

    function hideTypingIndicator() {
        typingIndicator.style.display = 'none';
    }

    function sendMessage() {
    const message = userInput.value.trim();
    if (message) {
        addMessage('You', message, true);
        showTypingIndicator();
        fetch('/query', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',\n                'X-CSRFToken': csrfToken,
            },
            body: JSON.stringify({query: message}),
        })
        .then(response => {\n            if (response.status === 401) {\n                window.location.href = '/';\n                throw new Error('Authentication required');\n            }\n            if (!response.ok) {\n                throw new Error('Request failed');\n            }\n            return response.json();\n        })
        .then(data => {
            hideTypingIndicator();
            addMessage('Chatbot', data.response);
            if (data.sources && data.sources.length > 0) {
                addMessage('Sources', data.sources.join(', '));
            }
        });
        userInput.value = '';
    }
}

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
